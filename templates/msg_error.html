<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Miku Status: ERROR</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: linear-gradient(rgba(12, 15, 18, 0.8), rgba(5, 6, 8, 0.8)), url('/static/miku.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #e0e0e0; margin: 0; padding: 50px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box;
        }
        .card {
            background: #14181e; padding: 40px; border-radius: 16px;
            border: 2px solid #ff4757; /* Красная рамка ошибки */
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.3);
            text-align: center; max-width: 450px; width: 100%;
        }
        p { font-family: 'Courier New', Courier, monospace; color: #ff4757; text-shadow: 0 0 5px rgba(255, 71, 87, 0.5); font-size: 18px; }
        .btn {
            display: inline-block; background: transparent; color: #ff4757; border: 2px solid #ff4757;
            padding: 10px 25px; text-decoration: none; border-radius: 30px; font-weight: bold; margin-top: 20px; transition: all 0.3s;
        }
        .btn:hover { background: #ff4757; color: #0c0f12; box-shadow: 0 0 15px #ff4757; }
    </style>
</head>
<body>
    <div class="card">
        <p>[ СТАТУС: КРИТИЧЕСКАЯ ОШИБКА ]</p>
        <p>Ядру терминала не удалось сохранить лог. Возможно, поля формы заполнены некорректно или произошел сбой диска.</p>
        <a href="/projects" class="btn">ПОПРОБОВАТЬ СНОВА</a>
    </div>
</body>
</html>
