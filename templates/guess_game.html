<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Miku Guess Game</title>
    <style>
                body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: linear-gradient(rgba(12, 15, 18, 0.8), rgba(5, 6, 8, 0.8)), 
                              url('/static/miku.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            padding: 50px 20px 80px 20px; /* Отступы со всех сторон, чтобы карточка не прижималась */
            min-height: 100vh; /* Растягиваем фон строго на 100% высоты экрана */
            box-sizing: border-box; /* Защита от сломанных отступов */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        h1 { 
            color: #ffffff; 
            text-align: center; 
            font-size: 32px;
            text-shadow: 0 0 15px rgba(57, 197, 187, 0.4);
        }
        .game-card {
            background: #14181e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #39c5bb;
            box-shadow: 0 4px 20px rgba(57, 197, 187, 0.2);
            text-align: center;
        }
        .status-msg {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .attempts-count {
            color: #39c5bb;
            font-weight: bold;
            margin-bottom: 25px;
        }
        input[type="text"] {
            background: #0c0f12;
            border: 1px solid #2c3e50;
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 18px;
            width: 80%;
            text-align: center;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            border-color: #39c5bb;
            outline: none;
            box-shadow: 0 0 8px rgba(57, 197, 187, 0.3);
        }
        .btn {
            background: transparent;
            color: #39c5bb;
            border: 2px solid #39c5bb;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #39c5bb;
            color: #0c0f12;
            box-shadow: 0 0 15px rgba(57, 197, 187, 0.5);
        }
        .btn-reset {
            color: #2ecc71;
            border-color: #2ecc71;
        }
        .btn-reset:hover {
            background: #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            text-decoration: none;
        }
        .back-link:hover { color: #39c5bb; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Онлайн-модуль: Угадайка</h1>

        <div class="game-card">
            <!-- Сюда Flask будет подставлять сообщения вроде "Больше" или "Меньше" -->
            <p class="status-msg">{{ message }}</p>
            <p class="attempts-count">Использовано попыток: {{ attempts }} из 7</p>

            <!-- Если игра НЕ окончена, показываем форму ввода числа -->
            {% if not game_over %}
            <form action="/check_number" method="POST">
                <input type="text" name="user_number" placeholder="Введите ваше число" autofocus required autocomplete="off">
                <br>
                <button type="submit" class="btn">ПРОВЕРИТЬ</button>
            </form>
            {% else %}
            <!-- Если игра окончена, прячем ввод и показываем кнопку "Сыграть еще раз" -->
            <a href="/reset_guess" class="btn id btn-reset" style="text-decoration: none; display: inline-block;">СЫГРАТЬ ЕЩЕ РАЗ</a>
            {% endif %}
        </div>

        <a href="/projects" class="back-link">← Вернуться в терминал проектов</a>
    </div>

</body>
</html>
