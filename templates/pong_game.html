<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Miku Pong Online</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: linear-gradient(rgba(12, 15, 18, 0.8), rgba(5, 6, 8, 0.8)), url('/static/miku.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { 
            color: #ffffff; 
            text-shadow: 0 0 15px rgba(57, 197, 187, 0.4);
            margin-bottom: 20px;
        }
        /* Окно, где будет загружаться игра */
        .game-container {
            border: 3px solid #39c5bb;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(57, 197, 187, 0.4);
            background: #000;
            overflow: hidden;
            width: 800px;
            height: 600px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-link {
            display: block;
            margin-top: 25px;
            color: #7f8c8d;
            text-decoration: none;
        }
        .back-link:hover { color: #39c5bb; }
    </style>
</head>
<body>

    <h1>Онлайн-модуль: Пинг-Понг</h1>

    <div class="game-container">
        <!-- Сюда мы подключаем движок itch.io или локальный веб-плеер, который подхватит наш скрипт -->
        <iframe src="https://github.io" allow="autoplay; fullscreen"></iframe>
    </div>

    <a href="/projects" class="back-link">← Вернуться в терминал проектов</a>

</body>
</html>
