<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Miku Pong Terminal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: linear-gradient(rgba(12, 15, 18, 0.8), rgba(5, 6, 8, 0.8)), url('/static/miku.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { 
            color: #ffffff; 
            text-shadow: 0 0 15px rgba(57, 197, 187, 0.4);
            margin-bottom: 10px;
        }
        .sub-title {
            color: #39c5bb;
            margin-bottom: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .game-card {
            background: #14181e;
            padding: 40px;
            border-radius: 16px;
            border: 2px solid #39c5bb;
            box-shadow: 0 0 25px rgba(57, 197, 187, 0.3);
            text-align: center;
            max-width: 550px;
            width: 100%;
        }
        .retro-screen {
            background: #000;
            border: 1px solid #2c3e50;
            border-radius: 8px;
            padding: 40px 20px;
            margin-bottom: 30px;
            color: #39c5bb;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(57, 197, 187, 0.5);
        }
        .btn {
            display: inline-block;
            background: transparent;
            color: #2ecc71;
            border: 2px solid #2ecc71;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #2ecc71;
            color: #0c0f12;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.6);
            transform: translateY(-2px);
        }
        .back-link {
            display: block;
            margin-top: 30px;
            color: #7f8c8d;
            text-decoration: none;
        }
        .back-link:hover { color: #39c5bb; }
    </style>
</head>
<body>

    <h1>🏓 Модуль: Пинг-Понг</h1>
    <div class="sub-title">2D Arcade Simulation</div>

    <div class="game-card">
        <div class="retro-screen">
            <p>[ СИСТЕМА ГОТОВА К ЗАПУСКУ ]</p>
            <p>Жанр: Ретро-аркада (Мультиплеер / ИИ)</p>
            <p>Движок: Pygame-ce</p>
            <p>Управление: W/S для левой ракетки</p>
        </div>

        <!-- Кнопка, которая скачает чистый рабочий скрипт игры прямо на ПК -->
        <a href="/static/games/ping_pong.py" download="ping_pong.py" class="btn">ЗАПУСТИТЬ ЛОКАЛЬНЫЙ МОДУЛЬ (.PY)</a>
    </div>

    <a href="/projects" class="back-link">← Вернуться в терминал проектов</a>

</body>
</html>
